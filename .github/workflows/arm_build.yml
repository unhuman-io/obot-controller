name: Arm build

on:
  push:
  pull_request:
    types: [assigned]

env:
  quiet: "-q"

jobs:
  build:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: obot_g474
            config: motor_template
          - project: obot_g474
            config: nucleo_uart
          - project: obot_g474
            config: nucleo_uart_obot
            build_other: -DCMAKE_CXX_FLAGS="-DCOMMS_UART_OBOT"
          - project: obot_g474
            config: nucleo_spi
          - project: obot_g474
            config: motor_enc
            build_other: -DCALIBRATION_FILE=../calibration/obot_g474/motor_enc/cal.c
          - project: obot_g474
            config: motor_wheel
          - project: obot_g474
            config: motor_can
          - project: obot_g474
            config: osa14
          - project: obot_g474
            config: motor_40_osa14
          - project: obot_g474
            config: motor_9
          - project: obot_g474
            config: motor_9_pzdma
          - project: obot_g474
            config: motor_aksim
          - project: obot_g474
            config: motor_aksim_19_17
            build_other: -DCMAKE_CXX_FLAGS="-DMAX11254_TORQUE_SENSOR" # MR2
          - project: obot_g474
            config: motor_pz2 # MR1
          - project: obot_g474
            config: h2
          - project: obot_g474
            config: hands
          - project: obot_g474
            config: motor_aksim_20_19 # MR0
          - project: obot_g474
            config: motor_aksim_19_18 # MR0P
          - project: obot_g474
            config: motor_resolute
          - project: obot_g474
            config: trace
          - project: obot_g474
            config: trace_6enc
          - project: obot_g474
            config: tmotor_driver
          - project: obot_g474
            config: trace_13enc
          # TODO: add this back
          # - project: obot_g474
          #   config: osa14_jl1
    runs-on: ubuntu-latest
    container: leemagnusson/arm-gcc:15.2
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
        submodules: recursive
    - name: install dependencies
      run: |
        apt-get update -qq
        apt-get install -y -qq clang-tools-20 cmake ninja-build
        ./motorlib/scripts/install_llvm.sh
    - name: cmake ${{ matrix.project }} ${{ matrix.config }}
      run: |
        git config --global --add safe.directory '*'
        cmake --preset gcc ${{ matrix.build_other }}
        cmake --build --preset gcc -t ${{ matrix.project }}_${{ matrix.config }}_pkg
    - name: Archive ${{ matrix.project }} ${{ matrix.config }}
      uses: actions/upload-artifact@main
      with:
        name: ${{ matrix.project }} ${{ matrix.config }}
        path: |
          build/gcc/${{ matrix.project }}/config/${{ matrix.config }}.elf
          build/gcc/${{ matrix.project }}/config/${{ matrix.config }}.tgz
    - name: rename
      run: |
        mv build/gcc/${{ matrix.project }}/config/${{ matrix.config }}.elf ${{ matrix.project }}_${{ matrix.config }}.elf
        mv build/gcc/${{ matrix.project }}/config/${{ matrix.config }}.tgz ${{ matrix.project }}_${{ matrix.config }}.tgz
    - name: cmake llvm
      run: |
        cmake --preset llvm ${{ matrix.build_other }}
        cmake --build --preset llvm -t ${{ matrix.project }}_${{ matrix.config }}_pkg
    - name: scan build
      if: 0
      run: |
        git config --global --add safe.directory '*'
        cd ${{ matrix.project }}
        scan-build-20 --status-bugs --use-cc /gcc/bin/arm-none-eabi-gcc --use-c++ /gcc/bin/arm-none-eabi-g++ \
          --use-analyzer ../motorlib/llvm/bin/clang --analyzer-target=armv7m-none-eabi \
          -disable-checker core.FixedAddressDereference \
          make CONFIG=${{ matrix.config }} -j`nproc` GCC_PATH=/gcc/bin ${{ matrix.build_other }}
        scan-build-20 --status-bugs --use-cc ../motorlib/llvm/bin/clang --use-c++ ../motorlib/llvm/bin/clang++ \
          --use-analyzer ../motorlib/llvm/bin/clang --analyzer-target=armv7m-none-eabi \
          -disable-checker core.FixedAddressDereference \
          make CONFIG=${{ matrix.config }} -j`nproc` USE_LLVM=1 ${{ matrix.build_other }}
    - name: releaser main
      uses: pyTooling/Actions/releaser@v6.7.0
      if: contains(github.ref, 'develop')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ${{ matrix.project }}_${{ matrix.config }}.elf
          ${{ matrix.project }}_${{ matrix.config }}.tgz
        tag: develop
    - name: releaser develop
      uses: pyTooling/Actions/releaser@v6.7.0
      if: contains(github.ref, 'main')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ${{ matrix.project }}_${{ matrix.config }}.elf
          ${{ matrix.project }}_${{ matrix.config }}.tgz
        tag: main
  test:
    timeout-minutes: 10
    needs: [build]
    runs-on: [self-hosted, motor_enc]
    steps:
    - uses: actions/checkout@main
    - uses: actions/download-artifact@main
      with:
        name: obot_g474 motor_enc
    - uses: actions/download-artifact@main
      with:
        path: .
    - name: test
      run: |
        set -x
        ls
        tar xzf motor_enc.tgz
        ./motor_enc/load_motor_enc.sh -p 1-3.1 && sleep 5 && \
        ./motor_enc/load_motor_enc_calibration.sh -p 1-3.1 &
        tar xzf obot_g474\ motor_aksim_19_17/motor_aksim_19_17.tgz
        ./motor_aksim_19_17/load_motor_aksim_19_17.sh -p 1-3.2 & # MR2
        tar xzf obot_g474\ motor_aksim_20_19/motor_aksim_20_19.tgz
        ./motor_aksim_20_19/load_motor_aksim_20_19.sh -p 1-3.7 & # MR0
        tar xzf obot_g474\ motor_aksim_19_18/motor_aksim_19_18.tgz
        ./motor_aksim_19_18/load_motor_aksim_19_18.sh -p 1-3.6 & # MR0P
        tar xzf obot_g474\ motor_pz2/motor_pz2.tgz
        ./motor_pz2/load_motor_pz2.sh -p 1-3.5 & # MR1
        tar xzf obot_g474\ motor_9/motor_9.tgz
        ./motor_9/load_motor_9.sh -p 1-3.4.3 &
        # tar xzf obot_g474\ osa14_jl1/osa14_jl1.tgz
        # ./osa14_jl1/load_osa14_jl1.sh -p 1-3.4.2 &
        tar xzf obot_g474\ motor_can/motor_can.tgz
        ./motor_can/load_motor_can.sh -p 1-2 &

        wait
        sleep 6
        # motor_util -p 1-3.1 read | head # doesn't exit for some reason

        # check for existence
        motor_util -p 1-3.1
        motor_util -p 1-3.2
        motor_util -p 1-3.4.3
        motor_util -p 1-3.5
        motor_util -p 1-3.6
        motor_util -p 1-3.7
        motor_util -p 1-2
        # motor_util -p 1-3.4.2
        # num_motors=8
        num_motors=7

        motor_util -l --run-stats

        # check correct hash
        sha=$(git rev-parse HEAD | head -c7)
        [ $(motor_util -l | grep $sha | wc -l) -eq $num_motors ]

        check_var() { # name, value, low limit, high limit
          echo checking $3 "<" $1 "<" $4 with value $2
          (( $3 < $2 && $2 < $4 ))
          echo "Benchmark$1 0 $2 bytes" >> output.txt
        }

        check_var_eq() { # name, value, expected value
          echo checking $1 "==" $3 with value $2
          (( $3 == $2 ))
        }

        run_stats=$(motor_util -p 1-3.1 --run-stats --no-list | tail -n1)
        echo run_stats: $run_stats

        check_var max_fast_loop_cycles $(echo $run_stats | cut -d',' -f2) 600 900
        check_var max_fast_loop_period $(echo $run_stats | cut -d',' -f3) 3400 3500
        check_var max_main_loop_cycles $(echo $run_stats | cut -d',' -f4) 3000 6000
        check_var max_main_loop_period $(echo $run_stats | cut -d',' -f5) 17000 17100

        motor_util -p 1-3.1 --run-stats 1000 --no-list | awk -F", " \
          'NR==1 { for (i = 1; i < 5; i++) { headers[i]=$(i+5) } } \
          NR>1 { for (i in headers) { print "Benchmark" headers[i] \ 
          "\t" $(i+1) "\t" $(i+5) " cycles"} }' | tee -a output.txt

        program_size=$(wc -c < motor_enc/motor_enc_noparam.bin)
        check_var program_size $program_size 100000 300000

        param_size=$(wc -c < motor_enc/motor_enc_param_only.bin)
        check_var param_size $param_size 5000 20000

        text_size=$(size motor_enc.elf | tail -n1 | cut -f1)
        check_var text_size $text_size 100000 300000

        data_size=$(size motor_enc.elf | tail -n1 | cut -f2)
        check_var data_size $data_size 5000 20000

        bss_size=$(size motor_enc.elf | tail -n1 | cut -f3)
        check_var bss_size $bss_size 50000 100000

        stack_used=$(motor_util -p 1-3.1 --no-list --set-api stack_used | tail -n 1 | cut -f2 -d' ')
        check_var stack_used $stack_used 1000 4000

        heap_used=$(motor_util -p 1-3.1 --no-list --set-api heap_used | tail -n 1 | cut -f2 -d' ')
        check_var heap_used $heap_used 1000 16384

        api_used=$(motor_util -p 1-3.1 --no-list --set-api api_memory_used | tail -n 1 | cut -f2 -d' ')
        check_var api_used $api_used 1000 5000

        total_uptime=$(motor_util -p 1-3.2 --no-list --set-api total_uptime | tail -n 1 | cut -f2 -d' ')
        check_var total_uptime $total_uptime 100 100000000

        PYTHONPATH=/usr/share/motor-realtime python3 obot_g474/test/system/test_motor_enc.py -p 1-3.1 -v
        PYTHONPATH=/usr/share/motor-realtime python3 obot_g474/test/system/test_motor_aksim.py -p 1-3.2 -v
        PYTHONPATH=/usr/share/motor-realtime python3 obot_g474/test/system/test_motor_aksim.py -p 1-3.6 -v
        PYTHONPATH=/usr/share/motor-realtime python3 obot_g474/test/system/test_motor_aksim.py -p 1-3.7 -v

        cat output.txt

        # test motor9
        PYTHONPATH=/usr/share/motor-realtime python3 obot_g474/test/system/test_motor9.py

        tar xzf obot_g474\ motor_9_pzdma/motor_9_pzdma.tgz
        ./motor_9_pzdma/load_motor_9_pzdma.sh -p 1-3.4.3
        sleep 5
        config=$(motor_util -p 1-3.4.3 --no-list --set-api config | tail -n 1 | cut -f2 -d' ')
        check_var_eq config $config motor_9_pzdma

        # test motor9_pzdma
        PYTHONPATH=/usr/share/motor-realtime python3 obot_g474/test/system/test_motor9.py
        
    - name: test can
      run: |
        set -x
        # firmware loaded above - communicates over usb and can
        # may need ip link set can0 up type can bitrate 2000000 dbitrate 10000000 fd on one-shot on
        [ $(motor_util -f can0:1 --list-names-only) == can_test ]
        [ $(motor_util -f --list-names-only | tail -n1) == can_test ]
        PYTHONPATH=/usr/share/motor-realtime python3 obot_g474/test/system/test_motor_can.py
        
    - name: test uart
      run: |
        set -x
        tar xzf obot_g474\ nucleo_uart/nucleo_uart.tgz
        pushd nucleo_uart
        st-flash reset
        sleep 2
        ../scripts/uart_program.sh
        # extra reset because bootloader pin held misses watchdog reset
        ~/tmp/stm32flash/stm32flash /dev/ttyACM0 -g 0x8000000 -b 4000000 || true
        sleep 2
        motor_util -a /dev/ttyACM0 --uart-raw
        popd
        PYTHONPATH=/usr/share/motor-realtime python3 obot_g474/test/system/test_motor_uart_raw.py
    - name: Store benchmark result
      uses: rhysd/github-action-benchmark@v1
      with:
        tool: 'go'
        output-file-path: output.txt
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true        
